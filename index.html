<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExperienceChurch · Network Map v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060E1C;--surface:#0B1728;--surface2:#102036;--border:#1A3052;
  --cyan:#00C8FF;--teal:#0FBBB8;--indigo:#5B7DFF;--violet:#9B7DFF;
  --green:#34D399;--red:#F87171;--amber:#FBBF24;
  --text:#D8EBF8;--text2:#6A9ABF;--text3:#3A6080;
  --voip-color:#F59E0B;--cam-color:#EF4444;--server-color:#8B5CF6;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#header h1{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);white-space:nowrap}
#header h1 span{color:var(--cyan)}
.badge{padding:2px 8px;border-radius:3px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap}
.badge-online{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.badge-offline{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.badge-data{background:rgba(0,200,255,.08);color:var(--cyan);border:1px solid rgba(0,200,255,.2)}
#header-actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn svg{width:12px;height:12px;flex-shrink:0}
.btn-issues{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:var(--amber)}
.btn-issues:hover{background:rgba(251,191,36,.15);border-color:var(--amber);color:var(--amber)}
.btn-export{background:rgba(91,125,255,.1);border-color:rgba(91,125,255,.3);color:#8BA4FF}
.btn-export:hover{background:rgba(91,125,255,.2);border-color:var(--indigo)}
.btn-add{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.3);color:var(--green)}
.btn-add:hover{background:rgba(52,211,153,.15);border-color:var(--green)}
.btn-save{background:rgba(0,200,255,.1);border-color:rgba(0,200,255,.3);color:var(--cyan)}
#main{display:flex;flex:1;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#canvas,#fp-canvas{position:absolute;inset:0;width:100%;height:100%}
#canvas.hidden,#fp-canvas.hidden{display:none}
/* topology links */
.link-path{fill:none;stroke-linecap:round}
.link-gbe{stroke:rgba(15,187,184,.35);stroke-width:1.5}
.link-10gbe{stroke:rgba(251,191,36,.5);stroke-width:2.5;stroke-dasharray:6 3}
.link-offline{stroke:rgba(248,113,113,.2);stroke-width:1;stroke-dasharray:3 3}
.link-wired{stroke:rgba(107,154,191,.2);stroke-width:1;stroke-dasharray:4 3}
.pulse-dot{fill:var(--cyan);filter:drop-shadow(0 0 3px var(--cyan))}
.node-group,.ng{cursor:pointer}
.node-ring{fill:none;stroke-width:1.5;opacity:.5}
.ring-anim{animation:ring-pulse 2.5s ease-in-out infinite}
@keyframes ring-pulse{0%,100%{r:0;opacity:.8}80%{r:18px;opacity:0}}
.node-circle{stroke-width:2;transition:all .2s}
.ng:hover .node-circle,.fp-device:hover circle:first-of-type{filter:brightness(1.3)}
.ng.selected .node-circle{filter:brightness(1.4)}
.ng.selected .node-ring{opacity:.9}
.fp-device.selected circle{filter:brightness(1.4)!important}
.node-label,.node-ip{pointer-events:none}
/* detail panel */
#detail-panel{width:310px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .3s ease}
#detail-panel.hidden{width:0;border-left:none}
#panel-header{padding:13px 15px 9px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
#panel-device-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--text2);margin-bottom:2px;font-family:'JetBrains Mono',monospace}
#panel-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:6px;padding-right:50px}
#panel-status-row{display:flex;align-items:center;gap:7px}
#panel-status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#panel-status-text{font-size:11px;font-weight:500}
#panel-actions{position:absolute;top:12px;right:14px;display:flex;gap:5px;align-items:center}
.panel-icon-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:13px;border-radius:3px;border:none;background:transparent;transition:color .15s}
.panel-icon-btn:hover{color:var(--text);background:var(--surface2)}
#panel-body{flex:1;overflow-y:auto;padding:10px 15px}
#panel-body::-webkit-scrollbar{width:4px}
#panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.detail-section{margin-bottom:12px}
.detail-section-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--text3);margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.detail-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:6px}
.detail-key{font-size:11px;color:var(--text2);flex-shrink:0}
.detail-val{font-size:11px;color:var(--text);font-family:'JetBrains Mono',monospace;text-align:right;word-break:break-all}
.detail-val.green{color:var(--green)}.detail-val.red{color:var(--red)}.detail-val.amber{color:var(--amber)}
.radio-card{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin-bottom:5px}
.radio-band{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--cyan);margin-bottom:2px}
.radio-details{font-size:11px;color:var(--text2)}
.radio-details span{color:var(--text);font-family:'JetBrains Mono',monospace}
.fw-warning-bar{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:4px;padding:5px 8px;margin-bottom:9px;font-size:11px;color:var(--amber)}
.copy-val{cursor:pointer;border-bottom:1px dashed var(--text3)}
.copy-val:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
/* edit form */
.edit-field{margin-bottom:9px}
.edit-field label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;font-family:'JetBrains Mono',monospace}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:5px 8px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s}
.edit-field input:focus,.edit-field select:focus,.edit-field textarea:focus{border-color:var(--cyan)}
.edit-field select option{background:var(--surface2)}
.edit-field textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif}
.edit-actions{display:flex;gap:7px;margin-top:12px}
.edit-btn-save{flex:1;padding:6px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;background:var(--cyan);color:#060E1C;border:none}
.edit-btn-save:hover{opacity:.85}
.edit-btn-cancel{padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;background:transparent;color:var(--text2);border:1px solid var(--border)}
.edit-btn-cancel:hover{border-color:var(--text2)}
.edit-btn-danger{padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer;background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.3)}
/* port map */
.port-grid{display:grid;gap:3px;margin:5px 0}
.port-cell{border-radius:2px;text-align:center;font-size:8px;font-family:'JetBrains Mono',monospace;min-height:17px;display:flex;align-items:center;justify-content:center;cursor:help;transition:filter .1s}
.port-cell:hover{filter:brightness(1.3)}
.port-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.port-legend-item{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text3)}
.port-legend-dot{width:7px;height:7px;border-radius:1px;flex-shrink:0}
/* filter bar */
#filter-bar{position:absolute;top:9px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:center;background:rgba(11,23,40,.93);border:1px solid var(--border);border-radius:18px;padding:3px 8px;backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap;max-width:calc(100% - 20px)}
.view-sep{width:1px;height:16px;background:var(--border);margin:0 4px}
.view-btn{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .15s;white-space:nowrap}
.view-btn.active{background:rgba(0,200,255,.15);color:var(--cyan);border:1px solid rgba(0,200,255,.3)}
.view-btn:hover:not(.active){color:var(--text)}
.filter-btn{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .15s;white-space:nowrap}
.filter-btn.active{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.filter-btn:hover:not(.active){color:var(--text)}
#search-wrap{display:flex;align-items:center;border-left:1px solid var(--border);margin-left:3px;padding-left:7px}
#search-input{background:transparent;border:none;color:var(--text);font-size:11px;outline:none;width:100px}
#search-input::placeholder{color:var(--text3)}
/* legend + zoom */
#legend{position:absolute;bottom:14px;left:14px;background:rgba(11,23,40,.93);border:1px solid var(--border);border-radius:7px;padding:9px 12px;backdrop-filter:blur(8px);font-size:11px;z-index:5}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--text2)}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend-line{width:16px;height:2px;flex-shrink:0;border-radius:1px}
#zoom-controls{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:3px;background:rgba(11,23,40,.93);border:1px solid var(--border);border-radius:6px;overflow:hidden;backdrop-filter:blur(8px);z-index:5}
.zoom-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;background:transparent;border:none}
.zoom-btn:hover{color:var(--text);background:var(--surface2)}
/* floor plan extras */
#fp-controls{position:absolute;bottom:56px;right:14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.fp-ctrl-btn{padding:4px 9px;border-radius:5px;font-size:11px;cursor:pointer;background:rgba(11,23,40,.93);border:1px solid var(--border);color:var(--text2);transition:all .15s;text-align:center;white-space:nowrap}
.fp-ctrl-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.fp-upload-label{padding:4px 9px;border-radius:5px;font-size:11px;cursor:pointer;background:rgba(11,23,40,.93);border:1px solid var(--border);color:var(--text2);transition:all .15s;text-align:center;white-space:nowrap}
.fp-upload-label:hover{border-color:var(--green);color:var(--green)}
.fp-ctrl-btn.hidden,.fp-upload-label.hidden{display:none}
/* floor plan room styles embedded in SVG */
/* tooltip */
#tooltip{position:absolute;pointer-events:none;background:rgba(11,23,40,.95);border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:12px;color:var(--text);display:none;z-index:50;max-width:220px}
/* modals */
.modal-overlay{position:fixed;inset:0;background:rgba(6,14,28,.85);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:90%;max-width:640px;max-height:88vh;display:flex;flex-direction:column}
.modal-box.narrow{max-width:440px}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hdr h2{font-size:13px;font-weight:600;color:var(--text)}
.modal-hdr span{font-size:11px;color:var(--text3)}
.modal-close{cursor:pointer;color:var(--text3);font-size:18px;line-height:1;background:none;border:none;padding:0}
.modal-close:hover{color:var(--text)}
.modal-body{overflow-y:auto;padding:14px 18px;flex:1}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.modal-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.issue-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--border)}
.issue-card.high{border-left-color:var(--red)}.issue-card.medium{border-left-color:var(--amber)}.issue-card.low{border-left-color:var(--text3)}
.issue-hdr{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.sev-badge{font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.sev-high{background:rgba(248,113,113,.2);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.sev-med{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
.sev-low{background:rgba(58,96,128,.3);color:var(--text3);border:1px solid var(--border)}
.issue-title{font-size:12px;font-weight:600;color:var(--text)}
.issue-device{font-size:11px;color:var(--cyan);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.issue-desc{font-size:11px;color:var(--text2);line-height:1.55;margin-bottom:4px}
.issue-action{font-size:11px;color:var(--green);display:flex;gap:4px}
.issue-action::before{content:'→';flex-shrink:0}
.ssid-table{width:100%;border-collapse:collapse;margin-top:7px;font-size:11px}
.ssid-table th{background:var(--surface);padding:4px 7px;text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.ssid-table td{padding:5px 7px;border-bottom:1px solid rgba(26,48,82,.5);color:var(--text2)}
.ssid-table tr:last-child td{border-bottom:none}
.ssid-name{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-weight:600}
#save-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);color:var(--green);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:500;pointer-events:none;opacity:0;transition:opacity .3s}
#save-toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="3" fill="var(--cyan)"/><path d="M6.34 6.34a7 7 0 0 1 9.9 0" stroke="var(--cyan)" stroke-width="1.5" stroke-linecap="round" opacity=".7"/><path d="M17.66 17.66a7 7 0 0 1-9.9 0" stroke="var(--cyan)" stroke-width="1.5" stroke-linecap="round" opacity=".7"/></svg>
  <h1><span>ExperienceChurch</span> · Network Map <span style="opacity:.45">v2</span></h1>
  <span class="badge badge-online" id="online-count">● 0 Online</span>
  <span class="badge badge-offline" id="offline-count">● 0 Offline</span>
  <span class="badge badge-data" id="data-stamp">Data: Jul 2 2026</span>
  <div id="header-actions">
    <button class="btn btn-issues" onclick="showIssues()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Issues <span id="issue-badge" style="background:rgba(248,113,113,.25);border:1px solid rgba(248,113,113,.4);border-radius:3px;padding:0 5px;font-size:10px;color:var(--red);margin-left:2px">9</span>
    </button>
    <button class="btn btn-add" onclick="showAddDevice()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Add Device
    </button>
    <button class="btn btn-save" onclick="exportUpdatedMap()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Map
    </button>
    <button class="btn btn-export" onclick="exportToExcel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Excel
    </button>
    <button class="btn btn-export" onclick="exportToWord()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Word
    </button>
    <button class="btn" onclick="fitView()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Fit
    </button>
  </div>
</div>

<div id="main">
  <div id="canvas-wrap">
    <!-- Topology -->
    <svg id="canvas"></svg>
    <!-- Floor Plan -->
    <svg id="fp-canvas" class="hidden"></svg>

    <!-- Filter bar — shared by both views -->
    <div id="filter-bar">
      <button class="view-btn active" data-view="topology" onclick="switchView('topology')">🔗 Topology</button>
      <button class="view-btn" data-view="floorplan" onclick="switchView('floorplan')">🏢 Floor Plan</button>
      <div class="view-sep"></div>
      <button class="filter-btn active" onclick="setFilter(this,'all')">All</button>
      <button class="filter-btn" onclick="setFilter(this,'router')">Router</button>
      <button class="filter-btn" onclick="setFilter(this,'switch')">Switches</button>
      <button class="filter-btn" onclick="setFilter(this,'ap')">APs</button>
      <button class="filter-btn" onclick="setFilter(this,'voip')">VoIP</button>
      <button class="filter-btn" onclick="setFilter(this,'offline')">⚠ Offline</button>
      <div id="search-wrap">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" placeholder=" name / IP / MAC" oninput="searchNodes(this.value)">
      </div>
    </div>

    <!-- Legend -->
    <div id="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--violet)"></div>ISP</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--indigo)"></div>Router</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>Switch</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>AP Online</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>AP / Offline</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--voip-color)"></div>VoIP</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--cam-color)"></div>Cam Switch</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--server-color)"></div>Server</div>
      <div id="topo-legend-lines" style="border-top:1px solid var(--border);margin-top:5px;padding-top:5px">
        <div class="legend-item"><div class="legend-line" style="background:rgba(251,191,36,.6)"></div>10 GbE</div>
        <div class="legend-item"><div class="legend-line" style="background:rgba(15,187,184,.5)"></div>1 GbE</div>
        <div class="legend-item"><div class="legend-line" style="background:rgba(248,113,113,.3)"></div>Offline link</div>
      </div>
      <div id="fp-legend-lines" class="hidden" style="border-top:1px solid var(--border);margin-top:5px;padding-top:5px">
        <div class="legend-item" style="font-size:10px;color:var(--text3)">Drag devices to position</div>
        <div class="legend-item" style="font-size:10px;color:var(--text3)">Click to view details</div>
      </div>
    </div>

    <!-- Zoom -->
    <div id="zoom-controls">
      <button class="zoom-btn" onclick="zoomBy(1.3)">+</button>

  isp:0,router:1,
  sw1:2,sw2:2,sw4a:2,'ap-office':2,
  'ap-youth':3,'ap-sound':3,'ap-stage':3,'ap-acpro':3,'ap-security':3,
  'ap-pastor':3,'ap-choir':3,'ap-conf':3,'ap-lobby':3,
  'voip-sw1':3,'grandstream':3,'ap-chapel':3,
  sw3:4,
  'ap-gym':5,'ap-kidz':5,'ap-lc':5,'cisco-cam':5,'sw4b':5,
  'ap-lcgym':6,'ap-lckitchen':6,'voip-b1':6,'voip-b2':6,'vms-asus':6
};
const TIER_Y = {0:60,1:155,2:265,3:382,4:488,5:594,6:698};
const X_ORDER = {
  isp:-.5,router:-.5,
  sw2:-5,sw1:0,sw4a:6,'ap-office':9.5,
  'ap-youth':-7.5,'ap-sound':-6.5,'ap-stage':-5.5,'ap-acpro':-4.5,'ap-security':-3.5,
  'ap-pastor':-1.5,'ap-choir':-.5,'ap-conf':.5,'ap-lobby':1.5,
  'voip-sw1':2.5,'grandstream':3.5,'ap-chapel':6,
  sw3:7,
  'ap-gym':5.5,'ap-kidz':6.5,'ap-lc':7.5,'cisco-cam':8.5,'sw4b':7,
  'ap-lcgym':5,'ap-lckitchen':6,'voip-b1':7,'voip-b2':8,'vms-asus':9
};

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function getColor(d){
  if(d.type==='isp') return'var(--violet)';
  if(d.type==='router') return'var(--indigo)';
  if(d.type==='switch') return'var(--teal)';
  if(d.type==='voip') return'var(--voip-color)';
  if(d.type==='cam-switch') return'var(--cam-color)';
  if(d.type==='server') return'var(--server-color)';
  if(d.status==='offline') return'var(--red)';
  return'var(--green)';
}
function getR(d){
  if(d.type==='isp') return 18;
  if(d.type==='router') return 21;
  if(d.type==='switch') return 15;
  if(['voip','server','cam-switch'].includes(d.type)) return 10;
  return 10;
}
function getIcon(d){
  if(d.type==='isp') return'☁';
  if(d.type==='router') return'⬡';
  if(d.type==='switch') return'⬟';
  if(d.type==='voip') return'☎';
  if(d.type==='cam-switch') return'▣';
  if(d.type==='server') return'▪';
  if(d.status==='offline') return'✕';
  return'◉';
}

// ═══════════════════════════════════════════════════════════════
//  TOPOLOGY VIEW
// ═══════════════════════════════════════════════════════════════
let svgEl, g, zoomBehavior, currentFilter='all', activeNodeId=null;
const tooltip = document.getElementById('tooltip');

function initSVG(){
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  svgEl=d3.select('#canvas').attr('width',W).attr('height',H);
  svgEl.selectAll('*').remove();
  const defs=svgEl.append('defs');
  const gf=defs.append('filter').attr('id','glow').attr('x','-30%').attr('y','-30%').attr('width','160%').attr('height','160%');
  gf.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','3').attr('result','blur');
  const fm=gf.append('feMerge');fm.append('feMergeNode').attr('in','blur');fm.append('feMergeNode').attr('in','SourceGraphic');
  const bg=defs.append('radialGradient').attr('id','bgG').attr('cx','50%').attr('cy','30%');
  bg.append('stop').attr('offset','0%').attr('stop-color','#0B1E38').attr('stop-opacity',.5);
  bg.append('stop').attr('offset','100%').attr('stop-color','#060E1C').attr('stop-opacity',0);
  svgEl.append('ellipse').attr('cx',W/2).attr('cy',H*.3).attr('rx',W*.65).attr('ry',H*.45).attr('fill','url(#bgG)');
  zoomBehavior=d3.zoom().scaleExtent([.1,3]).on('zoom',e=>g.attr('transform',e.transform));
  svgEl.call(zoomBehavior);
  g=svgEl.append('g');
  drawGraph(W,H);
  setTimeout(fitTopoView,100);
}

function drawGraph(W,H){
  const xSpan=20,pad=60,uw=W-pad*2;
  NODES.forEach(n=>{
    n._y=TIER_Y[TIERS[n.id]??4]??600;
    n._x=pad+(uw/2)+((X_ORDER[n.id]??0)/xSpan)*uw*.9;
  });
  const nm=Object.fromEntries(NODES.map(n=>[n.id,n]));
  const lG=g.append('g');
  const lS=lG.selectAll('.lg').data(LINKS).enter().append('g').attr('class','lg');
  lS.append('path').attr('class',d=>{
    if(d.offline) return'link-path link-offline';
    if(d.speed==='10gbe') return'link-path link-10gbe';
    const t=nm[d.target];
    if(t&&['voip','cam-switch','server'].includes(t.type)) return'link-path link-wired';
    return'link-path link-gbe';
  }).attr('d',d=>{
    const s=nm[d.source],t=nm[d.target];if(!s||!t)return'';
    return`M${s._x},${s._y} Q${(s._x+t._x)/2},${(s._y+t._y)/2-12} ${t._x},${t._y}`;
  });
  lS.append('title').text(d=>d.port?`${d.source} → ${d.target} | ${d.port}`:d.speed);

  LINKS.filter(d=>!d.offline&&['router','switch','isp'].includes(nm[d.source]?.type)&&['switch','router'].includes(nm[d.target]?.type)).forEach((d,i)=>{
    const s=nm[d.source],t=nm[d.target];if(!s||!t)return;
    const pe=lG.selectAll('.lg').filter((_,j)=>LINKS[j]===d).select('path').node();
    if(!pe) return;
    const len=pe.getTotalLength?pe.getTotalLength():100;
    const spd=d.speed==='10gbe'?1800:3200;
    const dot=g.append('circle').attr('r',d.speed==='10gbe'?2.5:1.8).attr('class','pulse-dot').attr('opacity',d.speed==='10gbe'?.9:.5);
    (function step(delay){dot.attr('opacity',0).transition().delay(delay).duration(0).attr('opacity',1).transition().duration(spd).ease(d3.easeLinear).attrTween('transform',()=>t2=>{const p=pe.getPointAtLength(t2*len);return`translate(${p.x},${p.y})`;}).on('end',()=>step(0));})(i*250);
  });

  const filt=getFilteredIds();
  const nG=g.append('g');
  const nS=nG.selectAll('.ng').data(NODES).enter().append('g').attr('class','ng')
    .attr('transform',d=>`translate(${d._x},${d._y})`).attr('opacity',d=>filt.includes(d.id)?1:.12)
    .on('click',(e,d)=>{e.stopPropagation();selectNode(d.id)})
    .on('mouseenter',(e,d)=>showTT(e,d)).on('mouseleave',()=>hideTT())
    .call(d3.drag().on('start',function(){d3.select(this).raise()}).on('drag',function(e,d){
      d._x+=e.dx;d._y+=e.dy;
      d3.select(this).attr('transform',`translate(${d._x},${d._y})`);
      lG.selectAll('.lg path').attr('d',l=>{const s=nm[l.source],t=nm[l.target];if(!s||!t)return'';return`M${s._x},${s._y} Q${(s._x+t._x)/2},${(s._y+t._y)/2-12} ${t._x},${t._y}`;});
    }));

  nS.filter(d=>['router','switch','isp'].includes(d.type)).append('circle').attr('class','node-ring ring-anim').attr('r',d=>getR(d)+4).attr('stroke',d=>getColor(d)).attr('fill','none');
  nS.filter(d=>d.fwWarning).append('circle').attr('r',d=>getR(d)+7).attr('fill','none').attr('stroke','rgba(251,191,36,.4)').attr('stroke-width',2).attr('stroke-dasharray','3 2');
  nS.append('circle').attr('class','node-circle').attr('r',d=>getR(d)).attr('fill',d=>getColor(d)).attr('fill-opacity',d=>d.type==='ap'?.8:1).attr('stroke',d=>getColor(d)).attr('stroke-width',2).attr('filter',d=>['router','isp'].includes(d.type)?'url(#glow)':null);
  nS.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',d=>d.type==='router'?11:d.type==='switch'?9:8).attr('fill','#fff').attr('pointer-events','none').text(d=>getIcon(d));
  nS.append('text').attr('class','node-label').attr('text-anchor','middle').attr('y',d=>getR(d)+10).attr('font-size',d=>['router','switch'].includes(d.type)?9.5:8.5).attr('font-weight',d=>['router','switch'].includes(d.type)?'600':'400').attr('fill',d=>getColor(d)).attr('pointer-events','none').text(d=>d.name.length>20?d.name.slice(0,18)+'…':d.name);
  nS.filter(d=>d.ip&&d.ip!=='—').append('text').attr('class','node-ip').attr('text-anchor','middle').attr('y',d=>getR(d)+21).attr('font-size',7).attr('fill','var(--text3)').attr('pointer-events','none').text(d=>d.ip);
  nS.filter(d=>d.status==='offline').append('circle').attr('r',5).attr('cx',7).attr('cy',-7).attr('fill','var(--red)').attr('stroke','var(--bg)').attr('stroke-width',1.5);
  nS.filter(d=>d.status==='offline').append('text').attr('x',7).attr('y',-7).attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',6).attr('fill','white').attr('pointer-events','none').text('!');
  nS.filter(d=>d.fwWarning).append('circle').attr('r',5).attr('cx',-7).attr('cy',-7).attr('fill','var(--amber)').attr('stroke','var(--bg)').attr('stroke-width',1.5);
  nS.filter(d=>d.fwWarning).append('text').attr('x',-7).attr('y',-7).attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',5.5).attr('fill','#060E1C').attr('pointer-events','none').text('!');
  svgEl.on('click',()=>closePanel());
  updateCounts();
  if(activeNodeId){const n=NODES.find(x=>x.id===activeNodeId);if(n)openPanel(n);}
}

function fitTopoView(){
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const xs=NODES.map(n=>n._x).filter(Boolean),ys=NODES.map(n=>n._y).filter(Boolean);
  if(!xs.length) return;
  const minX=Math.min(...xs)-50,maxX=Math.max(...xs)+50,minY=Math.min(...ys)-50,maxY=Math.max(...ys)+50;
  const sc=Math.min(W/(maxX-minX),H/(maxY-minY),.95);
  svgEl.transition().duration(500).call(zoomBehavior.transform,d3.zoomIdentity.translate((W-(minX+maxX)*sc)/2,(H-(minY+maxY)*sc)/2).scale(sc));
}

// ═══════════════════════════════════════════════════════════════
//  FLOOR PLAN VIEW
// ═══════════════════════════════════════════════════════════════
let fpSvg, fpG, fpZoom;
let FLOOR_BG_IMAGE = null;
let VIEW_MODE = 'topology';

try { FLOOR_BG_IMAGE = localStorage.getItem('church-fp-bg'); } catch(e){}

function initFloorPlan(){
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  fpSvg=d3.select('#fp-canvas').attr('width',W).attr('height',H);
  fpSvg.selectAll('*').remove();
  fpZoom=d3.zoom().scaleExtent([.15,4]).on('zoom',e=>fpG.attr('transform',e.transform));
  fpSvg.call(fpZoom);
  fpG=fpSvg.append('g');
  const FPW=1000,FPH=850;
  const sc=Math.min(W/FPW,H/FPH)*.9;
  fpSvg.call(fpZoom.transform,d3.zoomIdentity.translate((W-FPW*sc)/2,(H-FPH*sc)/2).scale(sc));
  drawFloorPlan();
  fpSvg.on('click',()=>closePanel());
}

function drawFloorPlan(){
  if(!fpG) return;
  fpG.selectAll('*').remove();

  // Outer boundary
  fpG.append('rect').attr('x',0).attr('y',0).attr('width',1000).attr('height',850)
     .attr('fill','#040C18').attr('rx',6);

  if(FLOOR_BG_IMAGE){
    fpG.append('image').attr('href',FLOOR_BG_IMAGE).attr('x',0).attr('y',0)
       .attr('width',1000).attr('height',850).attr('preserveAspectRatio','xMidYMid meet').attr('opacity',.85);
  } else {
    // Draw SVG rooms
    FLOOR_ROOMS.forEach(r=>{
      fpG.append('rect').attr('x',r.x).attr('y',r.y).attr('width',r.w).attr('height',r.h)
         .attr('fill',r.fill||'#0A1728').attr('stroke','#1E3A58').attr('stroke-width',1).attr('rx',2);
      const fs=Math.max(8,Math.min(11,Math.min(r.w,r.h)/7));
      fpG.append('text').attr('x',r.x+r.w/2).attr('y',r.y+r.h/2)
         .attr('text-anchor','middle').attr('dominant-baseline','central')
         .attr('font-size',fs).attr('font-family','Inter,sans-serif').attr('fill','#2A5070')
         .attr('pointer-events','none').text(r.label);
    });
  }

  // Device layer
  const filt=new Set(getFilteredIds());
  NODES.filter(n=>n.type!=='isp').forEach(node=>{
    if(!node.fpx) node.fpx=(DEFAULT_FLOOR_POS[node.id]?.x??500);
    if(!node.fpy) node.fpy=(DEFAULT_FLOOR_POS[node.id]?.y??425);

    const dg=fpG.append('g').attr('class','fp-device')
      .attr('transform',`translate(${node.fpx},${node.fpy})`)
      .attr('opacity',filt.has(node.id)?1:.08)
      .on('click',e=>{e.stopPropagation();selectNode(node.id);})
      .on('mouseenter',e=>showTT(e,node)).on('mouseleave',()=>hideTT())
      .call(d3.drag()
        .on('start',function(){d3.select(this).raise();})
        .on('drag',function(e){
          node.fpx+=e.dx;node.fpy+=e.dy;
          d3.select(this).attr('transform',`translate(${node.fpx},${node.fpy})`);
        })
      );

    if(node.id===activeNodeId) dg.classed('selected',true);

    const r=getR(node)+2; // slightly bigger on floor plan
    const col=getColor(node);

    // Glow for infrastructure
    if(['router','switch'].includes(node.type)){
      dg.append('circle').attr('r',r+5).attr('fill',col).attr('fill-opacity',.12);
    }
    // Main circle
    dg.append('circle').attr('r',r).attr('fill',col).attr('fill-opacity',node.type==='ap'?.85:1)
      .attr('stroke',col).attr('stroke-width',1.5)
      .attr('filter',['router'].includes(node.type)?'url(#glow)':null);
    // Icon
    dg.append('text').attr('text-anchor','middle').attr('dominant-baseline','central')
      .attr('font-size',r*.9).attr('fill','#fff').attr('pointer-events','none').text(getIcon(node));
    // Label
    const lbl=node.name.length>16?node.name.slice(0,15)+'…':node.name;
    dg.append('text').attr('text-anchor','middle').attr('y',r+11)
      .attr('font-size',8.5).attr('font-family','Inter,sans-serif').attr('fill',col)
      .attr('pointer-events','none').attr('font-weight',['router','switch'].includes(node.type)?'600':'400')
      .text(lbl);
    // Offline badge
    if(node.status==='offline'){
      dg.append('circle').attr('r',5).attr('cx',r-2).attr('cy',-(r-2)).attr('fill','var(--red)').attr('stroke','#040C18').attr('stroke-width',1.5);
      dg.append('text').attr('x',r-2).attr('y',-(r-2)).attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',6).attr('fill','white').attr('pointer-events','none').text('!');
    }
    // FW warning badge
    if(node.fwWarning){
      dg.append('circle').attr('r',5).attr('cx',-(r-2)).attr('cy',-(r-2)).attr('fill','var(--amber)').attr('stroke','#040C18').attr('stroke-width',1.5);
      dg.append('text').attr('x',-(r-2)).attr('y',-(r-2)).attr('text-anchor','middle').attr('dominant-baseline','central').attr('font-size',5.5).attr('fill','#060E1C').attr('pointer-events','none').text('!');
    }
  });
}

function fitFloorPlan(){
  if(!fpSvg) return;
  const wrap=document.getElementById('canvas-wrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const sc=Math.min(W/1000,H/850)*.9;
  fpSvg.transition().duration(500).call(fpZoom.transform,d3.zoomIdentity.translate((W-1000*sc)/2,(H-850*sc)/2).scale(sc));
}

function resetFloorPositions(){
  if(!confirm('Reset all device positions to defaults?')) return;
  NODES.forEach(n=>{
    n.fpx=DEFAULT_FLOOR_POS[n.id]?.x??500;
    n.fpy=DEFAULT_FLOOR_POS[n.id]?.y??425;
  });
  drawFloorPlan();
  showToast('Positions reset');
}

function uploadBlueprint(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    FLOOR_BG_IMAGE=e.target.result;
    try{localStorage.setItem('church-fp-bg',FLOOR_BG_IMAGE);}catch(err){}
    document.getElementById('clear-bp-btn').style.display='';
    drawFloorPlan();
    showToast('Blueprint loaded');
  };
  reader.readAsDataURL(file);
}

function clearBlueprint(){
  FLOOR_BG_IMAGE=null;
  try{localStorage.removeItem('church-fp-bg');}catch(e){}
  document.getElementById('clear-bp-btn').style.display='none';
  drawFloorPlan();
  showToast('Blueprint removed');
}

// ═══════════════════════════════════════════════════════════════
//  VIEW SWITCHING
// ═══════════════════════════════════════════════════════════════
function switchView(mode){
  VIEW_MODE=mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===mode));
  const topoSvg=document.getElementById('canvas');
  const fpC=document.getElementById('fp-canvas');
  const fpCtrl=document.getElementById('fp-controls');
  const topoLines=document.getElementById('topo-legend-lines');
  const fpLines=document.getElementById('fp-legend-lines');
  if(mode==='floorplan'){
    topoSvg.classList.add('hidden');
    fpC.classList.remove('hidden');
    fpCtrl.style.display='flex';
    topoLines.classList.add('hidden');
    fpLines.classList.remove('hidden');
    if(FLOOR_BG_IMAGE) document.getElementById('clear-bp-btn').style.display='';
    if(!fpG) initFloorPlan(); else drawFloorPlan();
  } else {
    fpC.classList.add('hidden');
    topoSvg.classList.remove('hidden');
    fpCtrl.style.display='none';
    topoLines.classList.remove('hidden');
    fpLines.classList.add('hidden');
    if(!g) initSVG();
  }
}

function fitView(){
  if(VIEW_MODE==='floorplan') fitFloorPlan();
  else fitTopoView();
}
function zoomBy(f){
  if(VIEW_MODE==='floorplan'&&fpSvg) fpSvg.transition().duration(250).call(fpZoom.scaleBy,f);
  else if(svgEl) svgEl.transition().duration(250).call(zoomBehavior.scaleBy,f);
}

// ═══════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════
function selectNode(id){
  activeNodeId=id;
  d3.selectAll('.ng').classed('selected',d=>d.id===id);
  d3.selectAll('.fp-device').classed('selected',function(){
    return d3.select(this).datum()===undefined&&this.__data__===undefined?false:false;
  });
  // highlight fp device
  if(VIEW_MODE==='floorplan'&&fpG){
    fpG.selectAll('.fp-device circle:first-child').attr('stroke-width',d=>d&&d.id===id?3.5:1.5);
  }
  const n=NODES.find(x=>x.id===id);if(n) openPanel(n);
}

function openPanel(node){
  document.getElementById('detail-panel').classList.remove('hidden');
  const tl={isp:'ISP',router:'Gateway Router',switch:'Network Switch',ap:'Access Point',voip:'VoIP Phone',server:'Server','cam-switch':'Camera Switch'};
  document.getElementById('panel-device-type').textContent=tl[node.type]||'Device';
  document.getElementById('panel-name').textContent=node.name;
  const dot=document.getElementById('panel-status-dot'),txt=document.getElementById('panel-status-text');
  if(node.status==='offline'){dot.style.background='var(--red)';txt.style.color='var(--red)';txt.textContent='Offline';}
  else{dot.style.background='var(--green)';txt.style.color='var(--green)';txt.textContent='Online';}
  document.getElementById('edit-btn').onclick=()=>openEditMode(node.id);
  let h='';
  if(node.fwWarning) h+=`<div class="fw-warning-bar">⚠ Outdated firmware: ${node.version}</div>`;
  h+=`<div class="detail-section"><div class="detail-section-title">Network</div>`;
  if(node.ip&&node.ip!=='—') h+=row('IP',node.ip);
  if(node.mac) h+=row('MAC',`<span class="copy-val" onclick="copyText('${node.mac}',this)">${node.mac}</span>`);
  if(node.uplink) h+=row('Uplink',node.uplink);
  if(node.uplinkPort) h+=row('Port',node.uplinkPort);
  h+=row('Speed',node.uplinkSpeed||'GbE');
  h+=`</div><div class="detail-section"><div class="detail-section-title">Device</div>`;
  if(node.model) h+=row('Model',node.model);
  if(node.version) h+=row('Firmware',`<span class="${node.fwWarning?'amber':''}">${node.version}</span>`);
  if(node.cpu) h+=row('CPU',node.cpu+'%',parseFloat(node.cpu)>80?'red':parseFloat(node.cpu)>60?'amber':'green');
  if(node.mem) h+=row('Mem',node.mem+'%',parseFloat(node.mem)>85?'red':parseFloat(node.mem)>70?'amber':'');
  if(node.isStpRoot) h+=row('STP','Root Bridge','green');
  h+=`</div>`;
  if(node.portMap){h+=`<div class="detail-section"><div class="detail-section-title">Port Map</div>`;h+=renderPortMap(node.portMap);h+=`</div>`;}
  if(node.type==='ap'&&(node.ch24||node.ch5)){
    h+=`<div class="detail-section"><div class="detail-section-title">Radio</div>`;
    if(node.ch24) h+=`<div class="radio-card"><div class="radio-band">2.4 GHz</div><div class="radio-details">Ch: <span>${node.ch24}</span></div></div>`;
    if(node.ch5)  h+=`<div class="radio-card"><div class="radio-band">5 GHz</div><div class="radio-details">Ch: <span>${node.ch5}</span></div></div>`;
    h+=`</div>`;
  }
  if(node.ssids?.length){h+=`<div class="detail-section"><div class="detail-section-title">SSIDs</div>`;node.ssids.forEach(s=>h+=`<div class="detail-row"><div class="detail-val" style="color:var(--cyan);text-align:left">${s}</div></div>`);h+=`</div>`;}
  if(node.notes) h+=`<div class="detail-section"><div class="detail-section-title">Notes</div><div style="font-size:11px;color:var(--text2);line-height:1.6">${node.notes}</div></div>`;
  if(VIEW_MODE==='floorplan') h+=`<div class="detail-section"><div class="detail-section-title">Floor Plan</div><div style="font-size:11px;color:var(--text2)">Drag the device icon on the floor plan to reposition it.</div></div>`;
  document.getElementById('panel-body').innerHTML=h;
}

function row(label,val,cls=''){return`<div class="detail-row"><div class="detail-key">${label}</div><div class="detail-val ${cls}">${val}</div></div>`;}

function renderPortMap(pm){
  const {total,connections}=pm;
  const cols=total<=8?4:total<=16?8:12;
  const tc={ap:'rgba(52,211,153,.55)',switch:'rgba(15,187,184,.55)',router:'rgba(91,125,255,.55)',voip:'rgba(251,191,36,.55)','cam-switch':'rgba(239,68,68,.55)',server:'rgba(139,92,246,.55)',other:'rgba(107,154,191,.35)'};
  const uc='rgba(91,125,255,.7)';
  let h=`<div class="port-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
  for(let i=1;i<=total;i++){
    const c=connections[i];
    const bg=c?(c.isUplink?uc:(tc[c.type]||'rgba(107,154,191,.3)')):'var(--surface2)';
    h+=`<div class="port-cell" style="background:${bg};border:1px solid ${c?'transparent':'var(--border)'};color:${c?'var(--text)':'var(--text3)'}" title="Port ${i}${c?': '+c.name+(c.isUplink?' (uplink)':''):' empty'}">${i}</div>`;
  }
  h+=`</div><div class="port-legend">`;
  [['AP',tc.ap],['Switch',tc.switch],['Uplink',uc],['VoIP',tc.voip],['Cam',tc['cam-switch']],['Svr',tc.server]].forEach(([l,c])=>h+=`<div class="port-legend-item"><div class="port-legend-dot" style="background:${c}"></div>${l}</div>`);
  return h+'</div>';
}

function copyText(txt,el){
  navigator.clipboard?.writeText(txt).then(()=>{const o=el.textContent;el.textContent='copied!';el.style.color='var(--green)';setTimeout(()=>{el.textContent=o;el.style.color='';},1200);});
}

  const so=['online','offline'].map(s=>`<option value="${s}"${node.status===s?' selected':''}>${s}</option>`).join('');
  const to=['ap','switch','router','voip','server','cam-switch','isp'].map(t=>`<option value="${t}"${node.type===t?' selected':''}>${t}</option>`).join('');
  const h=`
  <div style="font-size:11px;color:var(--text3);margin-bottom:9px;padding:4px 7px;background:var(--surface2);border-radius:4px;border:1px solid var(--border)">
    Editing: <span style="color:var(--text)">${node.name}</span>
  </div>
  <div class="edit-field"><label>Name</label><input id="ef-name" value="${node.name.replace(/"/g,'&quot;')}"></div>
  <div class="edit-field"><label>Type</label><select id="ef-type">${to}</select></div>
  <div class="edit-field"><label>Status</label><select id="ef-status">${so}</select></div>
  <div class="edit-field"><label>IP</label><input id="ef-ip" value="${node.ip||''}"></div>
  <div class="edit-field"><label>MAC</label><input id="ef-mac" value="${node.mac||''}"></div>
  <div class="edit-field"><label>Model</label><input id="ef-model" value="${(node.model||'').replace(/"/g,'&quot;')}"></div>
  <div class="edit-field"><label>Firmware</label><input id="ef-version" value="${node.version||''}"></div>
  <div class="edit-field"><label>2.4 GHz Ch</label><input id="ef-ch24" value="${node.ch24||''}"></div>
  <div class="edit-field"><label>5 GHz Ch</label><input id="ef-ch5" value="${node.ch5||''}"></div>
  <div class="edit-field"><label>SSIDs (comma sep.)</label><input id="ef-ssids" value="${(node.ssids||[]).join(', ')}"></div>
  <div class="edit-field"><label>Uplink Device</label><input id="ef-uplink" value="${node.uplink||''}"></div>
  <div class="edit-field"><label>Uplink Port</label><input id="ef-uplinkPort" value="${node.uplinkPort||''}"></div>
  <div class="edit-field"><label>Notes</label><textarea id="ef-notes" rows="4">${(node.notes||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea></div>
  <div class="edit-actions">
    <button class="edit-btn-save" onclick="saveNodeEdit('${node.id}')">Save</button>
    <button class="edit-btn-cancel" onclick="openPanel(NODES.find(n=>n.id==='${node.id}'))">Cancel</button>
    <button class="edit-btn-danger" onclick="deleteNode('${node.id}')">Delete</button>
  </div>`;
  document.getElementById('panel-body').innerHTML=h;
}

function saveNodeEdit(id){
  const node=NODES.find(n=>n.id===id);if(!node)return;
  const oldUplink=node.uplink;
  node.name=document.getElementById('ef-name').value.trim();
  node.type=document.getElementById('ef-type').value;
  node.status=document.getElementById('ef-status').value;
  node.ip=document.getElementById('ef-ip').value.trim()||'—';
  node.mac=document.getElementById('ef-mac').value.trim();
  node.model=document.getElementById('ef-model').value.trim();
  node.version=document.getElementById('ef-version').value.trim();
  node.ch24=document.getElementById('ef-ch24').value.trim();
  node.ch5=document.getElementById('ef-ch5').value.trim();
  const ss=document.getElementById('ef-ssids').value.trim();
  node.ssids=ss?ss.split(',').map(s=>s.trim()).filter(Boolean):[];
  node.uplink=document.getElementById('ef-uplink').value.trim();
  node.uplinkPort=document.getElementById('ef-uplinkPort').value.trim();
  node.notes=document.getElementById('ef-notes').value.trim();
  node.fwWarning=node.version&&(node.version.startsWith('6.')||node.version.startsWith('5.'));
  if(oldUplink!==node.uplink){
    const oldSrc=NODES.find(n=>n.name===oldUplink||n.id===oldUplink)?.id;
    const newSrc=NODES.find(n=>n.name===node.uplink||n.id===node.uplink)?.id;
    if(oldSrc){const li=LINKS.findIndex(l=>l.source===oldSrc&&l.target===id);if(li>=0){if(newSrc)LINKS[li].source=newSrc;else LINKS.splice(li,1);}}
    else if(newSrc) LINKS.push({source:newSrc,target:id,speed:'gbe',port:node.uplinkPort});
  }
  DATA_STAMP=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('data-stamp').textContent='Data: '+DATA_STAMP;
  redraw();showToast('Changes saved');
}

function deleteNode(id){
  if(!confirm('Remove this device from the map?'))return;
  const idx=NODES.findIndex(n=>n.id===id);if(idx<0)return;
  NODES.splice(idx,1);
  for(let i=LINKS.length-1;i>=0;i--){if(LINKS[i].source===id||LINKS[i].target===id)LINKS.splice(i,1);}
  closePanel();redraw();showToast('Device removed');
}

function redraw(){
  if(VIEW_MODE==='floorplan'){if(fpG)drawFloorPlan();}
  else{if(g){g.selectAll('*').remove();const wrap=document.getElementById('canvas-wrap');drawGraph(wrap.clientWidth,wrap.clientHeight);}}
  updateCounts();
}

function showAddDevice(){
  const sel=document.getElementById('ad-uplink-sel');

function toggleAPFields(){
  document.getElementById('ap-extra-fields').style.display=document.getElementById('ad-type').value==='ap'?'block':'none';
}
function submitAddDevice(){
  const name=document.getElementById('ad-name').value.trim();if(!name){alert('Name required');return;}
  const id='node-'+Date.now();
  const uplinkName=document.getElementById('ad-uplink-sel').value;
  const ss=document.getElementById('ad-ssids').value.trim();
  const node={id,name,type:document.getElementById('ad-type').value,status:document.getElementById('ad-status').value,
    ip:document.getElementById('ad-ip').value.trim()||'—',mac:document.getElementById('ad-mac').value.trim(),
    model:document.getElementById('ad-model').value.trim(),version:document.getElementById('ad-version').value.trim(),
    uplink:uplinkName,uplinkPort:document.getElementById('ad-uplinkPort').value.trim(),
    ch24:document.getElementById('ad-ch24').value.trim(),ch5:document.getElementById('ad-ch5').value.trim(),
    ssids:ss?ss.split(',').map(s=>s.trim()).filter(Boolean):[],uplinkSpeed:'GbE',
    notes:document.getElementById('ad-notes').value.trim()};
  node.fwWarning=node.version&&(node.version.startsWith('6.')||node.version.startsWith('5.'));
  NODES.push(node);
  const srcNode=NODES.find(n=>n.name===uplinkName||n.id===uplinkName);
  if(srcNode) LINKS.push({source:srcNode.id,target:id,speed:'gbe',port:node.uplinkPort});
  TIERS[id]=(srcNode?(TIERS[srcNode.id]??2)+1:3);X_ORDER[id]=0;
  // Place on floor plan in center
  node.fpx=500;node.fpy=425;
  hideAddDevice();
  ['ad-name','ad-ip','ad-mac','ad-model','ad-version','ad-uplinkPort','ad-ch24','ad-ch5','ad-ssids','ad-notes'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  redraw();showToast('Device added — drag to position on floor plan');
}
document.getElementById('add-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)hideAddDevice();});

function getFilteredIds(){
  const f=currentFilter;
  return NODES.filter(n=>{
    if(f==='all')return true;
    if(f==='router')return['router','isp'].includes(n.type);
    if(f==='switch')return n.type==='switch';
    if(f==='ap')return n.type==='ap';
    if(f==='voip')return n.type==='voip';
    if(f==='offline')return n.status==='offline';
    return true;
  }).map(n=>n.id);
}
function setFilter(btn,f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('search-input').value='';
  applyFilter(getFilteredIds());
}
function applyFilter(ids){
  const s=new Set(ids);
  if(VIEW_MODE==='topology') d3.selectAll('.ng').attr('opacity',d=>s.has(d.id)?1:.12);
  if(VIEW_MODE==='floorplan'&&fpG) fpG.selectAll('.fp-device').attr('opacity',d=>s.has(d?.id)?1:.08);
}
function searchNodes(q){
  q=q.toLowerCase().trim();
  if(!q){applyFilter(getFilteredIds());return;}
  const m=new Set(NODES.filter(n=>n.name.toLowerCase().includes(q)||(n.ip&&n.ip.includes(q))||(n.mac&&n.mac.toLowerCase().includes(q))||(n.model&&n.model.toLowerCase().includes(q))).map(n=>n.id));
  if(VIEW_MODE==='topology') d3.selectAll('.ng').attr('opacity',d=>m.has(d.id)?1:.07);
  if(VIEW_MODE==='floorplan'&&fpG) fpG.selectAll('.fp-device').attr('opacity',d=>m.has(d?.id)?1:.05);
}
function updateCounts(){
  const on=NODES.filter(n=>n.status==='online'&&n.type!=='isp').length;
  const off=NODES.filter(n=>n.status==='offline').length;
  document.getElementById('online-count').textContent=`● ${on} Online`;
  document.getElementById('offline-count').textContent=`● ${off} Offline`;
}

function showTT(e,d){
  const wr=document.getElementById('canvas-wrap').getBoundingClientRect();
  let h=`<b>${d.name}</b>`;
  if(d.ip&&d.ip!=='—') h+=`<br><span style="color:var(--text3);font-family:'JetBrains Mono',monospace">${d.ip}</span>`;
  if(d.mac) h+=`<br><span style="color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:10px">${d.mac}</span>`;
  if(d.status==='offline') h+=`<br><span style="color:var(--red)">● Offline</span>`;
  if(d.fwWarning) h+=`<br><span style="color:var(--amber)">⚠ FW ${d.version}</span>`;
  tooltip.innerHTML=h;tooltip.style.display='block';
  tooltip.style.left=(e.clientX-wr.left+14)+'px';tooltip.style.top=(e.clientY-wr.top-38)+'px';
}
function hideTT(){tooltip.style.display='none';}

async function exportUpdatedMap(){
  try{
    const resp=await fetch(window.location.href);
    if(!resp.ok) throw new Error('Could not fetch page source');
    let src=await resp.text();
    src=src.replace(/\/\/ @@NODES_BEGIN@@[\s\S]*?\/\/ @@NODES_END@@/,'// @@NODES_BEGIN@@\nconst NODES = '+JSON.stringify(NODES,null,2)+';\n// @@NODES_END@@');
    src=src.replace(/\/\/ @@LINKS_BEGIN@@[\s\S]*?\/\/ @@LINKS_END@@/,'// @@LINKS_BEGIN@@\nconst LINKS = '+JSON.stringify(LINKS,null,2)+';\n// @@LINKS_END@@');
    src=src.replace(/let DATA_STAMP = '[^']*'/,`let DATA_STAMP = '${DATA_STAMP}'`);
    const blob=new Blob([src],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='network_map_v2.html';a.click();URL.revokeObjectURL(a.href);
    showToast('Map downloaded — commit to GitHub to publish');
  }catch(e){alert('Save failed: '+e.message+'\n\nWorks when served over HTTP (GitHub Pages). Use Excel/Word export for local files.');}
}

function showToast(msg){
  const t=document.getElementById('save-toast');t.textContent='✓ '+msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ═══════════════════════════════════════════════════════════════
//  EXPORTS (Excel + Word)
// ═══════════════════════════════════════════════════════════════
function exportToExcel(){
  const wb=XLSX.utils.book_new();
  function sheet(rows,name){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);}

  // ── 1. Full Inventory
  const all=[['Name','Type','Status','IP','MAC','Model','Firmware','Uplink Device','Uplink Port','Notes']];
  NODES.filter(n=>n.type!=='isp').forEach(n=>all.push([
    n.name,n.type,n.status,n.ip||'—',n.mac||'—',n.model||'—',
    n.version||'—',n.uplink||'—',n.uplinkPort||'—',n.notes||''
  ]));
  sheet(all,'Full Inventory');

  // ── 2. Access Points
  const aps=[['AP Name','Status','IP','MAC','Model','Firmware','Uplink Switch','Switch Port','2.4 GHz Ch','5 GHz Ch','SSIDs','Notes']];
  NODES.filter(n=>n.type==='ap').forEach(n=>aps.push([
    n.name,n.status,n.ip,n.mac||'—',n.model||'—',n.version||'—',
    n.uplink,n.uplinkPort,n.ch24||'—',n.ch5||'—',
    (n.ssids||[]).join(', '),n.notes||''
  ]));
  sheet(aps,'Access Points');

  // ── 3. Switch Summary
  const sw=[['Switch Name','IP','MAC','Model','Uplink Device','Uplink Port','Link Speed','CPU %','Mem %','STP Root','Total Ports','Used Ports','Notes']];
  NODES.filter(n=>n.type==='switch').forEach(n=>{
    const used = n.portMap ? Object.keys(n.portMap.connections||{}).length : 0;
    const total = n.portMap ? n.portMap.total : '—';
    sw.push([n.name,n.ip,n.mac,n.model||'—',n.uplink,n.uplinkPort,
      n.uplinkSpeed||'GbE',n.cpu||'—',n.mem||'—',
      n.isStpRoot?'Yes':'No',total,used,n.notes||'']);
  });
  sheet(sw,'Switch Summary');

  // ── 4. Port Maps (one section per switch)
  const pm=[['Switch','Switch IP','Port #','Port Name','Connected Device','Device Type','Is Uplink','Notes']];
  NODES.filter(n=>n.type==='switch'||n.type==='router').forEach(n=>{
    if(!n.portMap) return;
    const {total,connections} = n.portMap;
    for(let i=1;i<=total;i++){
      const c = connections[i];
      pm.push([
        n.name, n.ip, i,
        c ? c.name : '(empty)',
        c ? c.name : '',
        c ? c.type : '',
        c && c.isUplink ? 'Yes' : '',
        ''
      ]);
    }
    // blank row between switches
    pm.push(['','','','','','','','']);
  });
  sheet(pm,'Port Maps');

  // ── 5. VoIP + Wired Devices
  const vw=[['Name','Type','Model','MAC','Uplink Switch','Port','Notes']];
  NODES.filter(n=>['voip','cam-switch','server'].includes(n.type)).forEach(n=>
    vw.push([n.name,n.type,n.model||'—',n.mac||'—',n.uplink,n.uplinkPort,n.notes||''])
  );
  sheet(vw,'VoIP + Wired Devices');

  // ── 6. Network Links (full topology)
  const lk=[['Source Device','Source IP','Target Device','Target IP','Link Speed','Port Info','Offline']];
  const nm=Object.fromEntries(NODES.map(n=>[n.id,n]));
  LINKS.forEach(l=>{
    const s=nm[l.source],t=nm[l.target];
    lk.push([
      s?s.name:l.source, s?s.ip:'—',
      t?t.name:l.target, t?t.ip:'—',
      l.speed==='10gbe'?'10 GbE':'1 GbE',
      l.port||'—',
      l.offline?'Yes':''
    ]);
  });
  sheet(lk,'Network Links');

  // ── 7. SSIDs
  sheet([
    ['SSID','Security','Scope','Client Isolation','Notes'],
    ['Leaders','WPA2','All APs','No','Staff/leadership'],
    ['ExperienceGateway','Open + Captive Portal','All APs','Yes','Guest — isolation blocks VoIP SIP'],
    ['ExperienceMedia','WPA2','Sound Booth only','No','AV/media equipment'],
    ['Learning Center','WPA2','LC near Gym, LC near Kitchen, Kidz Zone','No','Move VoIP phones here to fix SIP']
  ],'SSIDs');

  // ── 8. Open Issues
  const iss=[['#','Severity','Affected Device','Issue Title','Description','Recommended Action']];
  OPEN_ISSUES.forEach((i,x)=>iss.push([x+1,i.sev.toUpperCase(),i.device,i.title,i.desc,i.action]));
  sheet(iss,'Open Issues');

  // ── 9. IP Address Registry
  const ip=[['Device Name','Type','IP Address','MAC Address','DHCP/Static','Subnet','Notes']];
  NODES.filter(n=>n.ip&&n.ip!=='—'&&n.type!=='isp').forEach(n=>ip.push([
    n.name,n.type,n.ip,n.mac||'—',
    ['router','switch'].includes(n.type)?'Static':'DHCP',
    '10.0.0.0/20',n.notes||''
  ]));
  sheet(ip,'IP Address Registry');

  XLSX.writeFile(wb,`ExperienceChurch_Network_${new Date().toISOString().slice(0,10)}.xlsx`);
}

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>

}
